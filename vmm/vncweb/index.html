<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trex VM</title>
  <style>
    body { margin: 0; background: #20242b; color: #edf0f5; font: 15px system-ui; }
    header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; flex-wrap: wrap; }
    button { padding: 7px 12px; }
    main { display: flex; justify-content: center; padding: 12px; }
    canvas {
      background: black;
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      outline: 2px solid #596575;
    }
    canvas:focus { outline-color: #75baff; }
    p { margin: 8px 20px; color: #bcc5d1; }
    #status { flex: 1; }
    nav { display: flex; align-items: center; gap: 8px; padding: 12px 20px 0; flex-wrap: wrap; }
    #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    [role=tab] { background: #303844; color: inherit; border: 1px solid #596575; border-radius: 6px 6px 0 0; cursor: pointer; }
    [role=tab][aria-selected=true] { background: #75baff; color: #102033; border-color: #75baff; }
    #create { margin-left: auto; }
  </style>
</head>
<body>
  <nav aria-label="Virtual machines">
    <div id="tabs" role="tablist" aria-label="Virtual machines"></div>
    <button id="create" hidden>+ New VM</button>
  </nav>
  <header>
    <strong id="vm-name">trex VM</strong>
    <span id="status">Disconnected</span>
    <button id="connect">Connect</button>
    <button id="cad" disabled>Ctrl + Alt + Delete</button>
  </header>
  <p>Click the display to use the VM. If the mouse is captured, press Esc to release it. The VM keeps running when you disconnect.</p>
  <main>
    <canvas id="screen" width="640" height="480" tabindex="0" aria-label="Virtual machine display"></canvas>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>

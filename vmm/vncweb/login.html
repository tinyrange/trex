<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Desktop sign in · TinyRangeX</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #172d3d; background: #f4f6f8; font: 1rem system-ui, sans-serif; }
    main { width: min(26rem, calc(100% - 2rem)); padding: clamp(1.25rem, 5vw, 2rem); background: #fff; border: 1px solid #d7e0e6; border-top: 4px solid #126a5c; border-radius: .75rem; box-shadow: 0 8px 28px #213f4e14; }
    p { color: #126a5c; font-size: .875rem; font-weight: 720; margin: 0 0 .7rem; }
    [role="alert"] { color: #714b20; background: #fff8ed; border: 1px solid #dfc5a6; border-radius: .5rem; padding: .65rem .75rem; font-weight: 500; margin-bottom: 1rem; }
    h1 { font-size: 1.85rem; line-height: 1.1; letter-spacing: -.045em; margin: 0 0 1.5rem; }
    label { display: grid; gap: .5rem; color: #4e6473; font-size: .875rem; font-weight: 650; }
    input, button { font: inherit; min-height: 44px; padding: .65rem .75rem; border-radius: .5rem; width: 100%; }
    input { color: #172d3d; background: #f8fafb; border: 1px solid #aebec8; font-size: 1rem; }
    button { margin-top: 1rem; cursor: pointer; color: #fff; background: #126a5c; border: 1px solid transparent; font-weight: 700; }
    button:hover { background: #0d594d; }
    :focus-visible { outline: 2px solid #168675; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>TinyRangeX</p>
    <h1>Connect to your session</h1>
    <!-- login message -->
    <form method="post" action="./login">
      <label>Session token <input name="token" type="password" required autofocus autocomplete="current-password"></label>
      <button type="submit">Connect</button>
    </form>
  </main>
</body>
</html>

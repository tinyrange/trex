name: test

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable KVM for the runner
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/trex
      - run: go run ./cmd/trex test.star

  renvo-reactos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Enable KVM for the runner
        run: |
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 660 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Cache verified ReactOS media
        uses: actions/cache@v4
        with:
          path: local/media-cache/objects
          key: reactos-media-e5851510cf5b79ef51a76b8155dd5ef7faca1155f44d0a1d41c35b77ece4ce2a
      - name: Compile with Renvo and execute in pinned ReactOS
        run: go run ./cmd/trex scripts/smoke/renvo_reactos.star accelerator=kvm
      - name: Publish smoke summary
        if: always()
        shell: bash
        run: |
          if test -f local/renvo-reactos.md; then
            cat local/renvo-reactos.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Renvo / ReactOS smoke: did not run' >> "$GITHUB_STEP_SUMMARY"
            echo 'See the preceding setup or build failure in the action log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renvo-reactos-smoke
          path: local/renvo-reactos*
          if-no-files-found: warn
          retention-days: 14

  hello-memory-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify virtual Unix build mechanisms with the bundled compiler
        run: |
          go test -race -tags renvo_bundle ./emulator/shell ./emulator/linux ./renvostar/toolchain
          go test -race -tags renvo_bundle ./frontend/starlark -run '^TestUnixBuildRecipe$' -count=1
      - name: Build original GNU Hello and compare the same ELF natively
        env:
          TREX_HELLO_NATIVE: "1"
        run: go test -tags renvo_bundle ./frontend/starlark -run '^TestHelloRecipeNative$' -count=1 -v
